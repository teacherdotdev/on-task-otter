    <ellipse cx="14.5" cy="25.8" rx="3.5" ry="1.8" fill="#fff8ea" stroke-width="2"/>
    <ellipse cx="49.5" cy="25.8" rx="3.5" ry="1.8" fill="#fff8ea" stroke-width="2"/>
    <rect x="9.5" y="26.5" width="45" height="3.5" rx="1.75" fill="#a9d0c1"/>
