<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170">
  <!-- Three-legged stool: round top seen slightly from above, one leg in front, two splayed behind. -->
  <g stroke="#5a3d2b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- far legs, splayed -->
    <path d="M28 40H39L21.5 148Q20.5 152 17 152H14Q10.5 152 11.5 148z" fill="#a86f45"/>
    <path d="M28 40H39L21.5 148Q20.5 152 17 152H14Q10.5 152 11.5 148z" fill="#a86f45" transform="matrix(-1 0 0 1 120 0)"/>
    <!-- ring rung -->
    <ellipse cx="60" cy="101" rx="36" ry="9" fill="none" stroke-width="8"/>
    <ellipse cx="60" cy="101" rx="36" ry="9" fill="none" stroke="#d9a066" stroke-width="3.2"/>
    <!-- near leg -->
    <path d="M53 44H67L65.5 159Q65.5 163 62 163H58Q54.5 163 54.5 159z" fill="#d9a066"/>
    <path d="M60 56V84" fill="none" stroke="#fff8ea" stroke-width="2.2" opacity=".55"/>
    <!-- seat -->
    <path d="M10 32V41A50 15 0 0 0 110 41V32z" fill="#d9a066"/>
    <path d="M11.5 38A50 15 0 0 0 108.5 38V41A48.5 13.5 0 0 1 11.5 41z" fill="#5a3d2b" opacity=".18" stroke="none"/>
    <ellipse cx="60" cy="32" rx="50" ry="15" fill="#e8c290"/>
    <!-- round cushion -->
    <path d="M17 28V32A43 11 0 0 0 103 32V28z" fill="#6d89ad"/>
    <ellipse cx="60" cy="28" rx="43" ry="11" fill="#7f9cc0"/>
    <path d="M27 25C35 20.5 47 18.5 60 18.5C73 18.5 85 20.5 93 25C79 21.5 41 21.5 27 25z" fill="#fff8ea" opacity=".45" stroke="none"/>
    <circle cx="60" cy="28" r="2.6" fill="#e8b44f" stroke-width="2"/>
  </g>
</svg>
