      <circle cx="32" cy="33.7" r="2.2"/>
      <circle cx="41" cy="33.7" r="2.2"/>
    </g>
    <!-- oven door -->
    <rect x="16" y="39.5" width="32" height="10.5" rx="2.5" fill="#a9d0c1"/>
    <rect x="23" y="44.2" width="18" height="4.6" rx="1" fill="#5f938a" stroke="none"/>
    <path d="M26 47.8L28.6 45.2" fill="none" stroke="#fff8ea" stroke-width="2" opacity=".75"/>
    <path d="M22 42H42" fill="none" stroke-width="4.5"/>
    <path d="M22 42H42" fill="none" stroke="#fff8ea" stroke-width="1.8"/>
